# Ambiente LOCAL: base de datos de origen de RetailMax en SQL Server 2022.
#
# Uso:
#   1. Copiar .env.example a .env y definir una contraseña propia.
#   2. docker compose up -d
#   3. docker compose logs sqlserver-init   (verifica que las tablas se crearon)
#   4. docker compose down                  (apaga; los datos quedan en el volumen)
#      docker compose down -v               (apaga y BORRA los datos)

name: retailmax

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: retailmax-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"                      
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:${SQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql                     
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: retailmax-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${DB_NAME:-RetailMax}
    volumes:
      - ../generacion-datos/sql/ddl:/ddl:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P $$MSSQL_SA_PASSWORD -C -b"
        $$SQLCMD -v DB_NAME=$$DB_NAME -i /ddl/00_create_database.sql
        $$SQLCMD -d $$DB_NAME -i /ddl/01_create_tables.sql
    restart: "no"

volumes:
  sqldata:
